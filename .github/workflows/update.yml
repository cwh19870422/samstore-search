name: 每日更新商品清單

on:
  schedule:
    - cron: '17 19 * * *'   # UTC 19:17 = 台北時間每天凌晨 03:17（官網人少的時段）
  workflow_dispatch:         # 也可以在 Actions 頁面手動按「Run workflow」立刻更新

permissions:
  contents: write

concurrency:
  group: update-products
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 抓官網最新商品
        run: node scripts/update.mjs

      - name: 有變動就存回專案
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json meta.json
          if git diff --cached --quiet; then
            echo "沒有變動"
          else
            git commit -m "更新商品清單 $(date -u +%F)"
            git push
          fi
